target_manipulations:
  STANFORD_CARS:
    direct:
           models: ["linear", "mlp", "cnn", "transformer"]
           manipulations:
              - grayscale
              - hue_shift_60
              - noise_40
              - mask_big_square_center
              - mask_bottom_right_square
              - mask_small_square_center
              - mask_top_left_square
           feature_keys: ["feat1", "feat2", "feat3"]

    qwen_gs_1_infsteps_10:
          models: ["linear", "mlp", "cnn", "transformer"]
          manipulations:
            - Turn_on_headlights
            - Add_police_lights
            - Change_body_color_blue
            - Change_tire_rim_color_red
            - Remove_side_mirrors
          feature_keys: ["feat3"]
      
    #Geometric transform specific models
    geom_tf_apply_group:
              models: ["linear", "mlp", "cnn", "transformer"]
              manipulations:
                - rotation_90
                - rotation_180
                - rotation_270
                - mirror_h
                - mirror_v
              apply_transform: true
              feature_keys: ["feat1", "feat2", "feat3"]

model_path: "$WORK/models_cars/"
norm_params_path: "$WORK/models/norm_params_cars"
evals_path: "$WORK/evals_mapping_cars"
dataset_path: "$WORK/datasets"

# Supports features extracted from convnext and swinv2
extractor_name: ["convnext"]

subset_size: 50
batch_size: 8

loss_functions: ["mse_median_cos"]

feature_keys:
  convnext:
        # feat0:
        #   input_dim: 128
        #   output_dim: 128
        #   spatial_size: 72
        #   normalize_features: true
        #   recalc_norm_params: true
        feat1:
           input_dim: 256
           output_dim: 256
           spatial_size: 36
           normalize_features: true
           recalc_norm_params: true
        feat2:
           input_dim: 512
           output_dim: 512
           spatial_size: 18
           normalize_features: true
           recalc_norm_params: true
        feat3:
          input_dim: 1024
          output_dim: 1024
          spatial_size: 9
          normalize_features: false
          recalc_norm_params: false
  swinv2:
      #  feat0:
      #     input_dim: 128
      #     output_dim: 128
      #     spatial_size: 96
      #     normalize_features: true
      #     recalc_norm_params: true
      feat1:
            input_dim: 256
            output_dim: 256
            spatial_size: 48
            normalize_features: true
            recalc_norm_params: true
      feat2:
            input_dim: 512
            output_dim: 512
            spatial_size: 24
            normalize_features: true
            recalc_norm_params: true
      feat3:
            input_dim: 1024
            output_dim: 1024
            spatial_size: 12
            normalize_features: true
            recalc_norm_params: true
  dinov3:
      #  feat0:
      #    input_dim: 768
      #    output_dim: 768
      #    spatial_size: 14
      #    normalize_features: true
      #    recalc_norm_params: true
      feat1:
           input_dim: 768
           output_dim: 768
           spatial_size: 14
           normalize_features: true
           recalc_norm_params: true
      feat2:
           input_dim: 768
           output_dim: 768
           spatial_size: 14
           normalize_features: true
           recalc_norm_params: true
      feat3:
           input_dim: 768
           output_dim: 768
           spatial_size: 14
           normalize_features: true
           recalc_norm_params: true

models:
  linear: ""
  mlp:
     hidden_dim: 512
     dropout: 0.2
  cnn:
     hidden_dim: 512
     kernel_size: 3
     dropout: 0.2
  transformer:
    num_layers: 4
    num_heads: 8
    hidden_dim: 512
    dropout: 0.2


