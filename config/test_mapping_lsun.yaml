target_manipulations:
  lsun_bedroom:
    direct:
          models: ["linear", "mlp", "cnn", "transformer"]
          manipulations:
             - grayscale
             - hue_shift_60
             - noise_40
             - mask_big_square_center
             - mask_bottom_right_square
             - mask_small_square_center
             - mask_top_left_square
          feature_keys: ["feat1", "feat2", "feat3"]

    qwen_gs_1_infsteps_10:
           models: ["linear", "mlp", "cnn", "transformer"]
           manipulations:
              - Add_teddybear
              - Make_bed_unmade
              - Color_bedding_blue
              - Turn_on_lamps
           feature_keys: ["feat1", "feat2", "feat3"]
      
    #Geometric transform specific models
    geom_tf_apply_group:
             models: ["linear", "mlp", "cnn", "transformer"]
             manipulations:
               - rotation_90
               - rotation_180
               - rotation_270
               - mirror_h
               - mirror_v
             apply_transform: true
             feature_keys: ["feat1", "feat2", "feat3"]

model_path: "models_lsun/"
norm_params_path: "models/norm_params_lsun"
evals_path: "evals_mapping_lsun_paper"
dataset_path: "datasets"

# Supports features extracted from convnext and swinv2
extractor_name: ["convnext", "swinv2", "dinov3"]

subset_size: 100
batch_size: 2

loss_functions: ["mse_median_cos"]

feature_keys:
  convnext:
        feat1:
          input_dim: 256
          output_dim: 256
          spatial_size: 36
          normalize_features: true
          recalc_norm_params: true
        feat2:
          input_dim: 512
          output_dim: 512
          spatial_size: 18
          normalize_features: true
          recalc_norm_params: true
        feat3:
           input_dim: 1024
           output_dim: 1024
           spatial_size: 9
           normalize_features: false
           recalc_norm_params: false
  swinv2:
        feat1:
            input_dim: 256
            output_dim: 256
            spatial_size: 48
            normalize_features: true
            recalc_norm_params: true
        feat2:
            input_dim: 512
            output_dim: 512
            spatial_size: 24
            normalize_features: true
            recalc_norm_params: true
        feat3:
             input_dim: 1024
             output_dim: 1024
             spatial_size: 12
             normalize_features: true
             recalc_norm_params: false
  dinov3:
       feat1:
            input_dim: 768
            output_dim: 768
            spatial_size: 14
            normalize_features: true
            recalc_norm_params: true
       feat2:
            input_dim: 768
            output_dim: 768
            spatial_size: 14
            normalize_features: true
            recalc_norm_params: true
       feat3:
            input_dim: 768
            output_dim: 768
            spatial_size: 14
            normalize_features: true
            recalc_norm_params: true
models:
  linear: ""
  mlp:
     hidden_dim: 512
     dropout: 0.2
  cnn:
     hidden_dim: 512
     kernel_size: 3
     dropout: 0.2
  transformer:
    num_layers: 4
    num_heads: 8
    hidden_dim: 512
    dropout: 0.2


